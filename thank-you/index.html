<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank You — K.I Therapy</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../brand/logos/app-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  .thanks {
    min-height: 100svh; display: grid; place-items: center;
    background: linear-gradient(145deg, var(--pine-dk), var(--moss));
    color: var(--bone); text-align: center; padding: 2rem;
  }
  .thanks__card { max-width: 560px; }
  .thanks h1 { color: var(--bone); font-size: clamp(2.4rem, 6vw, 3.8rem); }
  .thanks h1 em { font-style: italic; color: var(--gold-lt); }
  .thanks p { color: rgba(243,239,232,.75); line-height: 1.85; }
  .thanks .btns { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin-top: 2.2rem; }
  @media (max-width: 620px) { .thanks .btns .btn { width: 100%; } }
</style>
</head>
<body>
<main class="thanks">
  <div class="thanks__card">
    <svg width="72" height="72" viewBox="0 0 200 200" aria-hidden="true" style="margin:0 auto 1.8rem">
      <circle cx="100" cy="100" r="87" fill="none" stroke="rgba(201,168,124,.4)" stroke-width="1"/>
      <circle cx="100" cy="66" r="14" fill="#C9A87C"/>
      <path d="M100 86 C 78 86 60 106 50 142 Q 100 124 150 142 C 140 106 122 86 100 86 Z" fill="#C9A87C"/>
      <path d="M42 148 Q 100 180 158 148 Q 100 162 42 148 Z" fill="#C9A87C"/>
    </svg>

    <span class="eyebrow" style="color:var(--gold-lt)">K.I Therapy</span>
    <h1>Thank you — <em>you're booked.</em></h1>
    <hr class="rule" style="margin-inline:auto">
    <p>A confirmation with everything you need is on its way to your inbox.
       For in-residence sessions, simply clear a space of roughly two metres by one —
       we bring the table, the linens, and the quiet.</p>

    <div class="btns">
      <a class="btn btn--gold" href="https://wa.me/447871141090?text=Hi%20Kem%2C%20I%20just%20booked%20a%20session%20and%20have%20a%20quick%20question.">Message us on WhatsApp</a>
      <a class="btn btn--ghost-lt" href="/">Back to K.I Therapy</a>
    </div>
  </div>
</main>
</body>
</html>
